[package]
name = "glowmarkt"
version = "0.5.2"
description = "Access to the Glowmarkt API for smart meter data."
authors = ["Dave Townsend <dtownsend@oxymoronical.com>"]
license = "MIT"
edition = "2021"
repository = "https://github.com/Mossop/glowmarkt-rs"
homepage = "https://github.com/Mossop/glowmarkt-rs"

[dependencies]
reqwest = { version = "^0.13.4", features = ["json", "query"] }
tokio = { version = "^1.52.3", features = ["full"] }
clap = { version = "^4.6.1", features = ["derive", "env"] }
serde = { version = "^1.0.228", features = ["derive"] }
log = "^0.4.33"
flexi_logger = { version = "^0.31.9", features = ["colors"] }
time = { version = "^0.3.53", features = ["serde", "serde-well-known", "parsing"] }
serde_json = "^1.0.150"
